[package]
name = "lunar-core"
version = "0.1.0"
edition = "2021"
description = "天文历算与历法核心库（VSOP87/ELPMPP02/章动/岁差/公历农历）"

[lib]
path = "src/lib.rs"

[features]
default = ["real-f64", "python-test"]
# 标量 Real 用 f64（缺省，误差依据见 doc/engineering/project-and-implementation.md §11.2.2）。
# 两个后端同时启用时 f64 优先，所以要 double-double 必须 --no-default-features --features twofloat
real-f64 = []
# 启用后编译并运行 VSOP87/ELPMPP02 vs JPL DE406 的 Python 对比测试（需 libpython，无 PYO3_PYTHON/DE406 时运行时跳过）。缺省开启；无 Python 时可用 cargo test --no-default-features --features real-f64 跑其余测试。
python-test = ["dep:pyo3"]

[dependencies]
once_cell = "1.19"
# double-double 后端，用于检验 f64 的误差
twofloat = { version = "0.8", optional = true }
num-traits = "0.2"
# 古历复原：大整数+分数，避免浮点千年误差
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
# 角度字符串解析（PlaneAngle.parse）
regex = "1.10"
# 仅当 feature python-test 时参与测试；默认开启以便 cargo test 跑全量测试，无 libpython 时用 --no-default-features --features real-f64
pyo3 = { version = "0.23", features = ["auto-initialize"], optional = true }

