# 构建 Web 前端并部署到 GitHub Pages
# 仓库需在 Settings → Pages → Build and deployment 中选择 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 星图、日食图用到的 CSV 及编译时嵌入 WASM 的年号表、平气表、民俗月表与月家神煞表由 Git LFS 管理；只拉这几个，不拉仓库里的大文件（PDF 等）
      - name: Pull LFS data for web
        run: git lfs pull --include="data/phenomena/capitals.csv,data/stars/hipparcos_bright.csv,data/sky_culture/*.csv,data/calendar/era_gaiyuan_day.csv,data/calendar/汇总/era_names_merged.csv,data/calendar/汇总/main_calendar_periods.csv,data/calendar/pingqi_lifa.csv,data/folk/shensha_month.csv,data/folk/xieji_yuebiao.csv"

      # 编译时嵌入 WASM 的 CSV 若仍是 LFS 指针，构建不会报错，只会让线上数据静默失效，所以在这里拦下
      - name: Check embedded CSVs are not LFS pointers
        run: |
          for f in data/calendar/era_gaiyuan_day.csv data/calendar/汇总/era_names_merged.csv data/calendar/汇总/main_calendar_periods.csv data/calendar/pingqi_lifa.csv data/folk/shensha_month.csv data/folk/xieji_yuebiao.csv; do
            if head -n 1 "$f" | grep -q '^version https://git-lfs'; then
              echo "::error file=$f::仍是 LFS 指针，请加入上一步的 git lfs pull 列表"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json

      - name: Setup Rust and wasm-pack
        uses: dtolnay/rust-toolchain@stable
      # 用预编译二进制安装；原先 curl rustwasm.github.io 的安装脚本偶发下载失败，导致整次部署失败
      # 版本与根目录 mise.toml 一致（改一处要同步另一处）；也作下方 wasm-pack 缓存的键
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-pages-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-pages-

      # 章动：若无 vendor/IAU2000/tab5.3a.txt 则从 IERS 拉取并生成（VLBI 合并格式），供后续 .bin 与前端加载
      - name: Prepare nutation (章动)
        run: |
          if [ ! -f vendor/IAU2000/tab5.3a.txt ]; then
            python3 scripts/ephemeris/iers_nutation_to_tab53a.py
          else
            echo "vendor/IAU2000/tab5.3a.txt exists, skip fetch"
          fi

      # wasm-pack 在构建中途从 GitHub Releases 下载 wasm-bindgen CLI 与 wasm-opt（Binaryen），其下载不重试；
      # 同一代码时成时败（c8b5c09 成、797cf4d 败，其间 rust/ 与工作流无改动），疑为下载失败（未见日志，未核），
      # 故缓存下载的工具，并整步重试
      - name: Cache wasm-pack tools (wasm-bindgen, wasm-opt)
        uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.14.0-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build WASM (wasm-lib + wasm-lib-f64)
        run: |
          for i in 1 2 3; do
            ./scripts/dev/build_wasm.sh --release && exit 0
            echo "::warning::WASM 构建第 $i 次失败"
            sleep 20
          done
          exit 1

      # 历表 + 改正：由原始文件生成 .bin（含章动 tab5.3a、VSOP87 地球改正 vsop87-{de406,de441}-earth，后者由已提交的
      # data/fit/*-planets.txt 生成；拟合本身需 DE406/DE441 BSP，在本地做），再压成 .bin.br
      - name: Generate ephemeris and patch .bin
        run: ./scripts/ephemeris/gen_ephemeris_bin.sh

      # 预算岁数据表（1900—2100）：与网页 Worker 同一组二进制历表与配置（DE431），首屏命中即不必下载历表、解方程。
      # 历表或算法有变，部署时自动随之重算，不入库
      - name: Precompute year data table
        run: cargo run --release --manifest-path rust/Cargo.toml -p lunar-core --no-default-features --features real-f64 --example gen_year_table -- 1900 2100 web/public/data/precomputed/yeardata-de431-f64.bin

      - name: Compress .bin to .br (ephemeris + patch)
        run: node scripts/ephemeris/compress_ephemeris_brotli.mjs

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Copy ephemeris data (raw + .bin + .br)
        working-directory: web
        run: npm run copy-data

      - name: Build web (Vite)
        working-directory: web
        env:
          # 项目站地址为 https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site (VitePress)
        working-directory: site
        env:
          # 文档站（site/，面向读者；doc/ 为开发知识库不发布）挂在应用子路径 https://<user>.github.io/<repo>/docs/
          DOCS_BASE: /${{ github.event.repository.name }}/docs/
          # 文档站导航「在线日历」回到应用站
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run build

      - name: Merge doc site into web build output
        run: cp -r site/.vitepress/dist web/dist/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
